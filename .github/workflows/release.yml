name: Release source preflight
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Prospective version tag to validate; nothing is published
        required: true
        type: string
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B eng/check.py --tag "$EXPECTED_TAG"
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
