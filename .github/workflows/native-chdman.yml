name: Chdman source preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Moonlark.Native.slnx --locked-mode
      - run: dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- repo check
