name: Libchdr native evidence
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, refactor/csharp-engineering]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Moonlark.Native.slnx --locked-mode
      - run: dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- repo check
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- qualification fixtures
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libchdr-synthetic-fixtures
          path: artifacts/fixtures/libchdr-final
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-fixture-logs
          path: artifacts/qualification/fixtures/*.log
          retention-days: 7
  linux-x64:
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-synthetic-fixtures
          path: artifacts/fixtures/libchdr-final
      - run: dotnet restore Moonlark.Native.slnx --locked-mode
      - run: dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
      - run: dotnet tool restore
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- qualification container --rid linux-x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-linux-x64-evidence
          path: |
            artifacts/qualification/linux-x64/*.log
            artifacts/qualification/linux-x64/builder.json
            artifacts/qualification/linux-x64/checkout/artifacts/qualification/linux-x64
            artifacts/qualification/linux-x64/checkout/artifacts/native/libchdr
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-linux-x64-generation
          path: artifacts/generation/libchdr
          retention-days: 7
  linux-arm64:
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-synthetic-fixtures
          path: artifacts/fixtures/libchdr-final
      - run: dotnet restore Moonlark.Native.slnx --locked-mode
      - run: dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
      - run: dotnet tool restore
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- qualification container --rid linux-arm64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-linux-arm64-evidence
          path: |
            artifacts/qualification/linux-arm64/*.log
            artifacts/qualification/linux-arm64/builder.json
            artifacts/qualification/linux-arm64/checkout/artifacts/qualification/linux-arm64
            artifacts/qualification/linux-arm64/checkout/artifacts/native/libchdr
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-linux-arm64-generation
          path: artifacts/generation/libchdr
          retention-days: 7
  win-x64:
    if: github.event_name == 'workflow_dispatch'
    needs: fixtures
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-synthetic-fixtures
          path: artifacts/fixtures/libchdr-final
      - name: Collect Windows evidence in the selected developer environment
        shell: cmd
        run: |
          if not exist "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" exit /b 1
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -version "[17.0,18.0)" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSROOT=%%i"
          if not defined VSROOT exit /b 1
          call "%VSROOT%\Common7\Tools\VsDevCmd.bat" -no_logo -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          if not exist artifacts\qualification\win-x64 mkdir artifacts\qualification\win-x64
          (echo ImageOS=%ImageOS%& echo ImageVersion=%ImageVersion%& echo RUNNER_ARCH=%RUNNER_ARCH%) > artifacts\qualification\win-x64\runner.txt
          dotnet restore Moonlark.Native.slnx --locked-mode
          if errorlevel 1 exit /b 1
          dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
          if errorlevel 1 exit /b 1
          dotnet tool restore
          if errorlevel 1 exit /b 1
          dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build --no-restore -- generate --check
          if errorlevel 1 exit /b 1
          dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build --no-restore -- qualification windows
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-win-x64-evidence
          path: |
            artifacts/qualification/win-x64
            artifacts/native/libchdr
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: libchdr-win-x64-generation
          path: artifacts/generation/libchdr
          retention-days: 7
  prepare-linux-subjects:
    needs: [linux-x64, linux-arm64]
    if: github.repository == 'MoonlarkStudios/romd-native' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/csharp-engineering')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-linux-x64-evidence
          path: artifacts/signing/linux-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-linux-arm64-evidence
          path: artifacts/signing/linux-arm64
      - run: dotnet restore eng/Moonlark.Native.Engineering --locked-mode
      - run: dotnet build eng/Moonlark.Native.Engineering -c Release --no-restore -warnaserror
      - run: dotnet run --project eng/Moonlark.Native.Engineering -c Release --no-build -- qualification subjects --source-commit "$EXPECTED_COMMIT"
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libchdr-linux-subjects
          path: artifacts/signing/subjects.sha256
          if-no-files-found: error
          retention-days: 7
  attest-linux:
    needs: prepare-linux-subjects
    if: github.repository == 'MoonlarkStudios/romd-native' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/refactor/csharp-engineering')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libchdr-linux-subjects
          path: subjects
      - id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: subjects/subjects.sha256
          push-to-registry: false
          create-storage-record: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libchdr-linux-provenance
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 7
