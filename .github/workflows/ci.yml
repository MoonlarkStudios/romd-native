name: Foundation
on:
  pull_request:
  push:
    branches: [main]
    tags: ['libchdr-*', 'chdman-*']
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -B eng/check.py
      - run: python3 -B eng/check.py --tag "$EXPECTED_TAG"
        if: github.ref_type == 'tag'
        env:
          EXPECTED_TAG: ${{ github.ref_name }}
      - run: python3 -B -m unittest discover -s eng -p 'test_*.py'
      - run: dotnet restore Moonlark.Native.slnx --locked-mode
      - run: dotnet build Moonlark.Native.slnx -c Release --no-restore -warnaserror
      - run: dotnet test Moonlark.Native.slnx -c Release --no-build --no-restore
